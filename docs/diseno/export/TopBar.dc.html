<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="display:flex;align-items:center;gap:36px;padding:18px 48px;background:#F4EFE4;border-bottom:1px solid #DDD3C2">
<a href="#" aria-label="Gate-Datos, inicio" style="display:flex;align-items:baseline;font:800 30px/1 'Shippori Mincho',serif;color:#1E1A15;letter-spacing:-.01em;text-decoration:none"><span>Gate</span><span style="position:relative;display:block;width:.44em;height:.6em;margin:0 .07em;border:.1em solid #A83F25;border-bottom:none;border-radius:.05em .05em 0 0"><span style="position:absolute;left:50%;bottom:0;width:.17em;height:.17em;margin-left:-.085em;border-radius:50%;background:#1E1A15"></span></span><span>Datos</span></a>
<nav aria-label="Navegación principal" style="display:flex;gap:4px;flex:1">
<a href="#" style="position:relative;padding:12px 14px;font-size:17px;font-weight:700;color:#1E1A15;text-decoration:none">Inicio<sc-if value="{{ aInicio }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:14px;right:14px;bottom:3px;height:3px;border-radius:2px;background:#A83F25"></span></sc-if></a>
<a href="#" style="position:relative;padding:12px 14px;font-size:17px;font-weight:700;color:#1E1A15;text-decoration:none">Por año<sc-if value="{{ aAnio }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:14px;right:14px;bottom:3px;height:3px;border-radius:2px;background:#A83F25"></span></sc-if></a>
<a href="#" style="position:relative;padding:12px 14px;font-size:17px;font-weight:700;color:#1E1A15;text-decoration:none">Torneos<sc-if value="{{ aTorneos }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:14px;right:14px;bottom:3px;height:3px;border-radius:2px;background:#A83F25"></span></sc-if></a>
<a href="#" style="position:relative;padding:12px 14px;font-size:17px;font-weight:700;color:#1E1A15;text-decoration:none">Jugadores<sc-if value="{{ aJug }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:14px;right:14px;bottom:3px;height:3px;border-radius:2px;background:#A83F25"></span></sc-if></a>
<a href="#" style="position:relative;padding:12px 14px;font-size:17px;font-weight:700;color:#1E1A15;text-decoration:none">Equipos<sc-if value="{{ aEq }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:14px;right:14px;bottom:3px;height:3px;border-radius:2px;background:#A83F25"></span></sc-if></a>
</nav>
<sc-if value="{{ showSearch }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:12px;width:360px;height:50px;padding:0 16px;background:#FBF8F1;border:2px solid #1E1A15;border-radius:12px"><span style="position:relative;flex:none;width:17px;height:17px;border:2.5px solid #1E1A15;border-radius:50%"><span style="position:absolute;width:2.5px;height:8px;background:#1E1A15;right:-4px;bottom:-7px;transform:rotate(-45deg)"></span></span><span style="font-size:17px;color:#5A5046">Buscar jugador, equipo o torneo</span></div></sc-if>
<span style="display:flex;align-items:center;gap:8px;padding:10px 14px;border:1.5px solid #DDD3C2;border-radius:999px;font-size:15px;font-weight:700"><span style="width:16px;height:16px;border-radius:50%;border:2px solid #1E1A15;background:linear-gradient(90deg,#1E1A15 50%,transparent 50%)"></span>Tema</span>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inicio&quot;,&quot;anio&quot;,&quot;torneos&quot;,&quot;jugadores&quot;,&quot;equipos&quot;],&quot;default&quot;:&quot;inicio&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showSearch&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? "inicio";
    return { aInicio: a === "inicio", aAnio: a === "anio", aTorneos: a === "torneos", aJug: a === "jugadores", aEq: a === "equipos", showSearch: this.props.showSearch ?? true };
  }
}
</script>
</body>
</html>
